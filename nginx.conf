# aplus-sy.com. Listens on plain port 80; Coolify (Traefik) handles HTTPS and the domain.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css text/plain text/xml application/javascript text/javascript application/json application/manifest+json image/svg+xml;

  # every location that sets its own headers must include this again (nginx drops inherited add_header)
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # short links for printed material
  rewrite ^/feedback/?$ /complaints.html last;
  rewrite ^/tables/?$ /tables.html last;

  error_page 404 /404.html;
  location = /404.html { internal; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/security-headers.conf; }

  # pages: always revalidate so price changes show up immediately; /complaints works without .html
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # the service worker and manifest must never be cached long, or phones get stuck on an old menu
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
  location = /manifest.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # photos, icons, fonts: file names stay the same when a photo is replaced, so a week, not forever
  location ~* \.(?:jpe?g|png|webp|gif|svg|ico|woff2?|ttf)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # never serve dotfiles or the deploy notes
  location ~ /\. { return 404; }
  location ~* \.md$ { return 404; }
}
