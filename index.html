<style>
/* Layout: olive hero band with the animated A+ mark, sticky arch-chip category rail, arch-framed item rows, bottom sheet for details. */
:root{
  --bg:#F2F6E6; --surface:#FBFDF4; --ink:#262D1E; --muted:#5C6650; --line:rgba(70,82,58,.15);
  --brand:#46523A; --on-brand:#EEF5DA; --sage:#6A7A4F; --brand-soft:#E2EAC9;
  --gold:#92692A; --gold-a:#B98A3E; --gold-b:#F4D58D;
  --hero-bg:#46523A; --hero-ink:#EEF5DA; --hero-muted:rgba(238,245,218,.72);
  --shadow:0 1px 2px rgba(38,45,30,.06),0 8px 24px rgba(38,45,30,.07);
  --scrim:rgba(18,22,13,.55);
  --f-display:"Montserrat","Montserrat Arabic","Tajawal",system-ui,sans-serif;
  --f-body:"Montserrat","Montserrat Arabic","Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.85,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13180F; --surface:#1C2318; --ink:#EEF5DA; --muted:#A8B494; --line:rgba(238,245,218,.11);
  --brand:#A9BC83; --on-brand:#13180F; --sage:#93A672; --brand-soft:#253020;
  --gold:#E6C477; --hero-bg:#222B1B; --hero-ink:#EEF5DA; --hero-muted:rgba(238,245,218,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13180F; --surface:#1C2318; --ink:#EEF5DA; --muted:#A8B494; --line:rgba(238,245,218,.11);
  --brand:#A9BC83; --on-brand:#13180F; --sage:#93A672; --brand-soft:#253020;
  --gold:#E6C477; --hero-bg:#222B1B; --hero-ink:#EEF5DA; --hero-muted:rgba(238,245,218,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold-a);outline-offset:2px;border-radius:8px}

/* HERO */
/* Chalkboard hero: coffee + book are chalked onto the board, then the gold A+ seal
   stamps down as the answer. Tap the seal to stamp it again. */
.hero{background:var(--hero-bg);color:var(--hero-ink);position:relative;overflow:hidden;isolation:isolate;
  background-image:radial-gradient(120% 70% at 80% 10%,rgba(238,245,218,.07),transparent 60%),
    repeating-linear-gradient(0deg,rgba(238,245,218,.035) 0 1px,transparent 1px 34px),
    repeating-linear-gradient(90deg,rgba(238,245,218,.035) 0 1px,transparent 1px 34px)}
.hero > .wrap{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
@media (min-width:820px){.hero > .wrap{min-height:min(100svh,720px)}}
.eq{display:flex;align-items:center;justify-content:center;gap:clamp(4px,1.6vw,12px);justify-self:center}
.eq .chalk{width:clamp(42px,12vw,70px);flex:none;overflow:visible;fill:none;stroke:var(--hero-ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.eq .chalk path{stroke-dasharray:1;stroke-dashoffset:1;animation:chalk .7s ease-out both}
.eq .book path{animation-delay:.55s}
.eq .steam path{stroke-dasharray:none;stroke-dashoffset:0;opacity:0;animation:steam 2.6s ease-in-out 1.2s infinite}
.eq .steam path:nth-child(2){animation-delay:1.6s}.eq .steam path:nth-child(3){animation-delay:2s}
.eq .op{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,5.4vw,34px);color:var(--gold-b);animation:pop .5s cubic-bezier(.3,1.6,.5,1) .4s both}
.eq .op + .book + .op{animation-delay:.95s}
@keyframes chalk{to{stroke-dashoffset:0}}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
.seal{position:relative;flex:none;width:clamp(132px,40vw,280px);aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
  rotate:-8deg;animation:stamp .55s cubic-bezier(.5,0,.75,0) 1.25s both}
.seal svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.seal .ring-txt{transform-origin:100px 100px;animation:spin 26s linear infinite}
.seal::before{content:"";position:absolute;inset:-6%;border-radius:50%;border:2px solid var(--gold-b);opacity:0;animation:dust .8s ease-out 1.8s both;pointer-events:none}
.seal::after{content:"";position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(closest-side,rgba(244,213,141,.2),transparent 70%);z-index:-1}
.seal:hover{rotate:-3deg;transition:rotate .3s var(--ease)}
.eq{animation:thud .35s ease-out 1.8s both}
.eq.again{animation-delay:.55s}.eq.again .seal{animation-delay:0s}.eq.again .seal::before{animation-delay:.55s}
.eq.hold,.eq.hold .seal,.eq.hold .seal::before{animation:none}
@keyframes stamp{0%{transform:scale(2.6) rotate(-24deg);opacity:0}70%{opacity:1}100%{transform:none;opacity:1}}
@keyframes dust{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes thud{0%,100%{transform:none}25%{transform:translateY(4px)}55%{transform:translateY(-2px)}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding-block:14px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;letter-spacing:.04em;font-size:15px}
.brand svg{width:34px;height:34px}
.lang{border:1px solid rgba(238,245,218,.3);background:rgba(238,245,218,.08);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:background .2s,transform .15s}
.lang:hover{background:rgba(238,245,218,.16)}
.top-end{display:flex;align-items:center;gap:8px}
.table-tag{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-weight:700;font-size:13px;color:#2B230F;background:linear-gradient(100deg,var(--gold-a),var(--gold-b));font-variant-numeric:tabular-nums}
.table-tag svg{width:14px;height:14px}
.lang:active{transform:scale(.95)}
.hero-grid{flex:1;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:26px;padding-block:18px 36px}
@media (min-width:820px){.hero-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;padding-block:20px 60px}
  .hero-grid .eq{grid-column:2;grid-row:1}.hero-grid .hero-copy{grid-column:1;grid-row:1}}

@keyframes spin{to{transform:rotate(360deg)}}


/* LOADER: logo draws in, gold bar fills, then the panel lifts away as an arch and the hero starts playing */
.loader{position:fixed;inset:0;z-index:100;background:#46523A;color:#EEF5DA;display:grid;place-items:center;
  border-radius:0 0 0 0;transition:transform .9s cubic-bezier(.75,0,.2,1),border-radius .9s cubic-bezier(.75,0,.2,1)}
.ld-box{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;transition:transform .7s cubic-bezier(.75,0,.2,1),opacity .5s}
.ld-mark{width:min(38vw,150px);aspect-ratio:1;position:relative}
.ld-mark svg{width:100%;height:100%}
.ld-mark::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:1.5px solid rgba(244,213,141,.5);border-top-color:transparent;border-left-color:transparent;animation:spin 1.1s linear infinite}
.ld-word{font-family:"Montserrat",sans-serif;font-weight:900;font-size:22px;letter-spacing:.42em;padding-inline-start:.42em;display:flex;direction:ltr}
.ld-word span{display:inline-block;animation:ldLetter .6s var(--ease) both;animation-delay:calc(.5s + var(--i)*.06s)}
@keyframes ldLetter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ld-bar{width:150px;height:3px;border-radius:3px;background:rgba(238,245,218,.15);overflow:hidden}
.ld-bar i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(var(--pr,0));background:linear-gradient(90deg,#B98A3E,#F4D58D);transition:transform .25s linear}
:root[dir="rtl"] .ld-bar i{transform-origin:right}
.ld-pct{font-family:"Montserrat",sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;color:rgba(238,245,218,.6);font-variant-numeric:tabular-nums;margin-top:-12px}
.loader.out{transform:translateY(-102%);border-radius:0 0 50% 50% / 0 0 22% 22%;pointer-events:none}
.loader.out .ld-box{transform:translateY(-60px) scale(.9);opacity:0}
.loader.gone{display:none}
/* hold every hero animation until the loader lifts */
.is-loading .hero *,.is-loading .hero *::before,.is-loading .hero *::after{animation-play-state:paused!important}
.is-loading body{overflow:hidden}
.mark .ring{stroke-dasharray:300;stroke-dashoffset:300;animation:ring 1.2s var(--ease) .1s forwards}
.mark .a1{transform-origin:50% 40%;animation:drop .9s var(--ease) .25s both}
.mark .a2{transform-origin:50% 60%;animation:rise .9s var(--ease) .45s both}
.mark .plus{transform-box:fill-box;transform-origin:center;animation:pop .7s cubic-bezier(.3,1.6,.5,1) .9s both}
.mark .shine{animation:shine 3.2s ease-in-out 1.8s infinite}
@keyframes ring{to{stroke-dashoffset:0}}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shine{0%,70%,100%{opacity:0}80%{opacity:.85}}
.eyebrow{font-size:12px;letter-spacing:.18em;font-weight:600;color:var(--gold-b);text-transform:uppercase}
:root[lang="ar"] .eyebrow{letter-spacing:.04em;font-size:13px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,9.6vw,82px);line-height:1;margin:12px 0 16px;letter-spacing:-.035em}
:root[lang="ar"] .hero h1{letter-spacing:0;line-height:1.3;font-size:clamp(36px,8.6vw,72px)}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .ln > *{display:inline-block;animation:lineUp .9s var(--ease) both}
.hero h1 .ln:nth-child(2) > *{animation-delay:.14s}
@keyframes lineUp{from{transform:translateY(105%)}to{transform:none}}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold-a),var(--gold-b) 45%,var(--gold-a) 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:lineUp .9s var(--ease) .14s both}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta2{color:var(--hero-ink);text-decoration:none;font-weight:600;font-size:14px;padding:12px 16px;border-radius:999px;border:1px solid rgba(238,245,218,.28);transition:background .2s}
.cta2:hover{background:rgba(238,245,218,.1)}
.hero p{color:var(--hero-muted);max-width:44ch;margin:0 0 22px;font-size:16px}
.cta{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(100deg,var(--gold-a),var(--gold-b) 55%,var(--gold-a));color:#2B230F;font-weight:700;padding:13px 22px;border-radius:999px;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:transform .2s var(--ease)}
.cta:hover{transform:translateY(-2px)}
.cta:active{transform:scale(.97)}
.cta svg{width:18px;height:18px}
:root[dir="rtl"] .cta svg{transform:scaleX(-1)}
.hero-copy > *{animation:fadeUp .8s var(--ease) both}
.hero-copy > *:nth-child(2){animation-delay:.08s}.hero-copy > *:nth-child(3){animation-delay:.16s}.hero-copy > *:nth-child(4){animation-delay:.24s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* CATEGORY RAIL */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);margin-top:14px}
.rail-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px;scroll-behavior:smooth}
.rail-row::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px 8px;border-radius:20px 20px 9px 9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:background .25s,color .25s,border-color .25s,transform .15s}
.chip svg{width:16px;height:16px;flex:none}
.chip small{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;transition:color .25s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip.on small{color:inherit;opacity:.7}

/* BRANDED SCROLL: gold scrollbar on desktop, gold progress line under the rail (phones hide scrollbars) */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold-a),var(--gold-b) 50%,var(--gold-a));border-radius:11px 11px 6px 6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--brand);border-width:2px}
.sheet::-webkit-scrollbar-track,.sec-menu::-webkit-scrollbar-track{background:var(--surface)}
.sheet::-webkit-scrollbar-thumb,.sec-menu::-webkit-scrollbar-thumb{border-color:var(--surface)}
.cx-log::-webkit-scrollbar-track{background:var(--hero-bg)}
.cx-log::-webkit-scrollbar-thumb{border-color:var(--hero-bg)}
@supports (-moz-appearance:none){html,.sheet,.cx-log,.sec-menu{scrollbar-width:thin;scrollbar-color:var(--gold-a) transparent}}
.rail-prog{position:absolute;inset-inline:0;bottom:-1px;height:2px;pointer-events:none;background:linear-gradient(90deg,var(--gold-a),var(--gold-b));
  transform:scaleX(var(--sp,0));transform-origin:left;box-shadow:0 0 8px rgba(244,213,141,.6)}
:root[dir="rtl"] .rail-prog{transform-origin:right;background:linear-gradient(270deg,var(--gold-a),var(--gold-b))}

/* SECTIONS DROPDOWN */
.rail-in{display:flex;align-items:center;gap:8px}
.rail-in .rail-row{flex:1;min-width:0}
.sec-btn{flex:none;width:42px;height:38px;border-radius:21px 21px 10px 10px;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 4px 12px rgba(38,45,30,.18);transition:transform .15s,background .25s}
.sec-btn:active{transform:scale(.93)}
.sec-btn svg{width:18px;height:18px;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.sec-btn[aria-expanded="true"]{background:linear-gradient(100deg,var(--gold-a),var(--gold-b) 55%,var(--gold-a));color:#2B230F}
.sec-btn[aria-expanded="true"] svg{transform:rotate(45deg) scale(1.1)}
.sec-menu{position:absolute;top:calc(100% + 8px);inset-inline-start:max(12px,calc((100% - 1080px) / 2 + 12px));width:min(360px,calc(100% - 24px));
  max-height:calc(100vh - 120px);max-height:calc(100svh - 120px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border:1px solid var(--line);border-radius:30px 30px 20px 20px;padding:10px;box-shadow:0 24px 60px rgba(18,22,13,.28);
  transform-origin:top left;opacity:0;visibility:hidden;transform:translateY(-10px) scale(.96);
  transition:opacity .2s,transform .3s var(--ease),visibility 0s .3s}
:root[dir="rtl"] .sec-menu{transform-origin:top right}
.sec-menu.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .4s var(--ease),visibility 0s}
.dd-head{display:flex;align-items:center;gap:8px;padding:8px 10px 8px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
:root[lang="ar"] .dd-head{letter-spacing:0;font-size:13px}
.dd-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
:root[dir="rtl"] .dd-head::after{background:linear-gradient(270deg,var(--line),transparent)}
.dd-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:16px;padding:7px 10px;text-align:start;cursor:pointer;
  font-weight:650;font-size:14.5px;color:var(--ink);opacity:0;transform:translateY(8px);
  transition:background .2s,opacity .3s,transform .4s var(--ease);transition-delay:0s}
.sec-menu.open .dd-item{opacity:1;transform:none;transition-delay:0s,calc(var(--i) * 32ms + 60ms),calc(var(--i) * 32ms + 60ms)}
.dd-item:hover,.dd-item:focus-visible{background:color-mix(in srgb,var(--brand-soft) 70%,transparent);outline:none}
.dd-item .di{width:36px;height:40px;flex:none;border-radius:18px 18px 9px 9px;background:var(--brand-soft);color:var(--sage);display:grid;place-items:center;transition:background .25s,color .25s,transform .3s var(--ease)}
.dd-item .di svg{width:19px;height:19px}
.dd-item:hover .di{transform:translateY(-2px)}
.dd-item small{margin-inline-start:auto;min-width:26px;height:22px;padding-inline:7px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--bg);font-variant-numeric:tabular-nums}
.dd-item.on .di{background:var(--brand);color:var(--on-brand)}
.dd-item.on small{color:#2B230F;background:linear-gradient(100deg,var(--gold-a),var(--gold-b))}
.dd-item.on::before{content:"";position:absolute;inset-inline-start:-10px;top:50%;width:4px;height:22px;margin-top:-11px;border-radius:0 4px 4px 0;background:var(--gold-a)}
:root[dir="rtl"] .dd-item.on::before{border-radius:4px 0 0 4px}
.dd-find{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;border:0;border-radius:16px;padding:12px;font-weight:800;font-size:14px;cursor:pointer;
  background:var(--hero-bg);color:var(--hero-ink);opacity:0;transition:opacity .3s .3s,transform .15s}
.sec-menu.open .dd-find{opacity:1}
.dd-find:active{transform:scale(.98)}
.dd-find svg{width:17px;height:17px;color:var(--gold-b)}

/* TOOLS */
.tools{display:flex;flex-direction:column;gap:10px;padding-block:18px 4px}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;padding-inline-start:42px;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 4px color-mix(in srgb,var(--sage) 18%,transparent)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);transition:all .2s}
.f.on{border-style:solid;border-color:var(--gold-a);color:var(--ink);background:color-mix(in srgb,var(--gold-b) 26%,transparent)}

/* SECTIONS */
main{padding-block:8px 20px}
.fab{align-items:center}
.sec{padding-top:34px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}
.sec-head{display:flex;align-items:end;gap:14px;margin-bottom:16px;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.sec-ic{width:46px;height:54px;flex:none;border-radius:23px 23px 10px 10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.sec-ic svg{width:24px;height:24px}
.sec-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.4vw,30px);line-height:1.1;margin:0;letter-spacing:-.01em}
.sec-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}

/* CARD */
.card{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:10px;padding-inline-end:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;text-align:start;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .5s var(--ease),opacity .5s var(--ease),border-color .25s,box-shadow .25s;transition-delay:var(--d,0ms)}
.card:hover{border-color:color-mix(in srgb,var(--sage) 55%,transparent);transform:translateY(-2px)}
.card:active{transform:scale(.985);transition-delay:0ms}
.card.soon{opacity:.62}
.card.out .frame img,.card.out .frame > svg{filter:grayscale(1);opacity:.55}
.card.out .c-name,.card.out .price{opacity:.6}
.card.out .price{text-decoration:line-through;text-decoration-thickness:2px}
.out-tag{position:absolute;inset:auto 0 0;padding:4px 0 5px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#fff;background:rgba(38,45,30,.82);z-index:1}
.ribbon{position:absolute;top:8px;inset-inline-end:-26px;rotate:45deg;width:92px;text-align:center;padding:2px 0;font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#2B230F;background:linear-gradient(100deg,var(--gold-a),var(--gold-b));z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.2)}
:root[dir="rtl"] .ribbon{rotate:-45deg}
/* the big arch in the detail sheet would hide a corner ribbon behind its curve, so there it is a pill */
:root .s-frame .ribbon{rotate:0deg;top:auto;bottom:12px;inset-inline-end:12px;width:auto;padding:4px 12px;border-radius:999px;font-size:12px}
.s-frame .out-tag{font-size:13px;padding:7px 0}
.out-band{background:color-mix(in srgb,var(--muted) 16%,transparent)}
.frame{position:relative;width:86px;aspect-ratio:86/104;border-radius:43px 43px 12px 12px;overflow:hidden;background:linear-gradient(170deg,var(--brand-soft),color-mix(in srgb,var(--brand-soft) 60%,var(--surface)));display:grid;place-items:center;color:var(--sage);max-width:100%}
.frame > svg{width:38%;height:auto;opacity:.85}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.frame img[data-ok]{opacity:1}
.stamp{position:absolute;bottom:6px;inset-inline-start:6px;font-family:var(--f-display);font-weight:800;font-size:11px;padding:2px 6px;border-radius:6px;color:#2B230F;background:linear-gradient(100deg,var(--gold-a),var(--gold-b));z-index:1}
.c-body{display:flex;flex-direction:column;min-width:0;padding-block:4px 2px}
.c-name{font-family:var(--f-display);font-weight:700;font-size:16.5px;line-height:1.25;margin:0}
.c-desc{color:var(--muted);font-size:13px;line-height:1.45;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.price{font-family:var(--f-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--ink)}
.price span{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);margin-inline-start:4px}
.plus{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(100deg,var(--gold-a),var(--gold-b) 55%,var(--gold-a));box-shadow:0 4px 10px rgba(185,138,62,.3);flex:none;transition:transform .3s var(--ease)}
.plus svg{width:14px;height:14px;color:#3A2D0F}
.card:hover .plus{transform:rotate(90deg)}
.tag{font-size:11.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);padding:1px 8px;border-radius:999px;white-space:nowrap}
.caf{display:inline-flex;align-items:center;gap:1px}
.caf svg{width:11px;height:13px;color:var(--line)}
.caf svg.f{color:var(--gold-a)}
.caf.none svg{opacity:.7}

/* reveal */
.pending{opacity:0;transform:translateY(22px) scale(.98)}

/* COMBOS */
.combos{margin-top:46px;padding:22px;border-radius:28px;background:var(--hero-bg);color:var(--hero-ink)}
.combos h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.4vw,30px);margin:0}
.combos > p{margin:4px 0 16px;opacity:.75;font-size:14px}
.combo-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}
.combo{background:color-mix(in srgb,var(--hero-ink) 9%,transparent);border:1px solid color-mix(in srgb,var(--hero-ink) 18%,transparent);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:transform .5s var(--ease),opacity .5s var(--ease);transition-delay:var(--d,0ms)}
.combo h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.combo .note{margin:0;font-size:13px;opacity:.75}
.combo-items{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.combo-items button{border:0;cursor:pointer;background:color-mix(in srgb,var(--hero-ink) 14%,transparent);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;transition:background .2s}
.combo-items button:hover{background:color-mix(in srgb,var(--hero-ink) 24%,transparent)}
.combo-items b{opacity:.6;font-weight:500}
.combo-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed color-mix(in srgb,var(--hero-ink) 25%,transparent);padding-top:8px;margin-top:auto;font-size:13px}
.combo-total strong{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}

.empty{display:none;text-align:center;padding:60px 10px;color:var(--muted)}
.empty.show{display:block}
.empty button{margin-top:12px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600}

/* FOOTER */
footer{margin-top:50px;background:var(--hero-bg);color:var(--hero-ink);border-radius:32px 32px 0 0;padding-block:30px calc(30px + env(safe-area-inset-bottom,0px))}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;align-items:start}
footer h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0 0 4px}
.flabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-b);margin-bottom:6px}
.phone{display:flex;align-items:center;gap:10px}
.phone strong{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;user-select:all;direction:ltr;unicode-bidi:isolate}
.ghost{border:1px solid rgba(238,245,218,.3);background:transparent;color:var(--hero-ink);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:8px;color:var(--hero-ink);text-decoration:none;border:1px solid rgba(238,245,218,.25);padding:8px 14px;border-radius:14px;font-weight:600;font-size:14px;transition:background .2s}
.links a:hover{background:rgba(238,245,218,.1)}
.links svg{width:17px;height:17px}
.rights{margin-top:24px;font-size:12.5px;color:var(--hero-muted);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.powered{display:inline-flex;align-items:center;gap:10px;color:var(--hero-muted);text-decoration:none;opacity:.85;transition:opacity .2s}
.powered:hover{opacity:1}
.powered img{height:26px;width:auto;display:block}

/* FAB */
.fab{position:fixed;z-index:30;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;transition:opacity .3s,transform .3s}
:root[dir="rtl"] .fab{inset-inline-start:max(12px,env(safe-area-inset-right,0px))}
.fab a{width:48px;height:48px;border-radius:24px 24px 14px 14px;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.fab a:hover{transform:translateY(-3px)}
.fab svg{width:22px;height:22px}
.fab .wa{background:var(--brand);color:var(--on-brand)}
.fab .ig{background:linear-gradient(100deg,var(--gold-a),var(--gold-b));color:#2B230F}
body:not(.past-hero) .fab{opacity:0;pointer-events:none;transform:translateY(10px)}
body.sheet-open .fab{opacity:0;pointer-events:none;transform:translateY(10px)}

/* SHEET */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;margin-inline:auto;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .5s var(--ease);
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet.drag{transition:none}
.handle{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px;cursor:grab}
.x{position:absolute;top:14px;inset-inline-end:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;z-index:2}
.x svg{width:16px;height:16px}
.s-frame{width:min(70%,250px);aspect-ratio:5/6;margin:6px auto 18px;border-radius:200px 200px 22px 22px}
.s-frame > svg{width:34%}
.sheet.on .s-frame{animation:frameIn .6s var(--ease) .05s both}
@keyframes frameIn{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.s-cat{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
:root[lang="ar"] .s-cat{letter-spacing:0;font-size:13px}
.s-title{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-top:2px}
.s-title h3{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.s-title .alt{display:block;font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);margin-top:4px}
.s-title .price{font-size:22px;white-space:nowrap}
.s-desc{color:var(--muted);margin:12px 0 16px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:2px}
.stat .caf svg{width:13px;height:16px}
.dots{display:inline-flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--sage)}
.pairs{margin-top:16px}
.pairs .k{font-size:12px;color:var(--muted);margin-bottom:6px}
.pairs div{display:flex;flex-wrap:wrap;gap:6px}
.pairs button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:border-color .2s}
.pairs button:hover{border-color:var(--sage)}
.pairs button span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.sig-band{margin-top:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--gold-b) 22%,transparent);font-size:13.5px}
.sig-band b{font-family:var(--f-display)}
/* "A+" on its own in Arabic text would flip to "+A" */
.stamp,.sig-band b{unicode-bidi:plaintext}

main.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

/* hero second button */
.cta2{display:inline-flex;align-items:center;gap:8px;background:rgba(238,245,218,.06);cursor:pointer;font-family:inherit;position:relative;overflow:hidden}
.cta2 svg{width:17px;height:17px;color:var(--gold-b)}

/* FINISHING: shimmer while a photo is still loading */
.frame:has(img:not([data-ok])){background-image:linear-gradient(100deg,var(--brand-soft) 30%,color-mix(in srgb,var(--brand-soft) 50%,var(--surface)) 50%,var(--brand-soft) 70%);background-size:220% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-220% 0}}

/* FINDER: the chat that asks what the customer feels like and picks from the menu */
.finder{position:fixed;inset:0;z-index:60;background:var(--hero-bg);color:var(--hero-ink);
  opacity:0;visibility:hidden;transform:scale(1.04);transition:opacity .35s,transform .45s var(--ease),visibility 0s .45s}
.finder.on{opacity:1;visibility:visible;transform:none;transition:opacity .35s,transform .45s var(--ease),visibility 0s}
.fd-in{max-width:560px;margin-inline:auto;height:100%;display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cx-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid rgba(238,245,218,.12)}
.cx-av{width:42px;height:42px;flex:none}
.cx-av svg{width:100%;height:100%;display:block}
.cx-who{flex:1;min-width:0;line-height:1.3}
.cx-who b{display:block;font-family:var(--f-display);font-weight:800;font-size:16px}
.cx-who small{display:inline-flex;align-items:center;gap:6px;color:var(--hero-muted);font-size:12.5px}
.cx-who small::before{content:"";width:7px;height:7px;border-radius:50%;background:#8FD16A}
.fd-x{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid rgba(238,245,218,.25);background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer}
.fd-x svg{width:16px;height:16px}
.cx-log{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;padding:16px 2px}
.cx-m{max-width:86%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.cx-m.bot{align-self:flex-start;background:rgba(238,245,218,.08);border:1px solid rgba(238,245,218,.12);border-end-start-radius:6px}
.cx-m.me{align-self:flex-end;background:linear-gradient(100deg,var(--gold-a),var(--gold-b));color:#2B230F;font-weight:600;border-end-end-radius:6px}
.cx-m.wide{max-width:min(94%,420px)}
.cx-m.new{animation:msgIn .35s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.cx-typing{display:flex;gap:4px;padding:15px 16px}
.cx-typing i{width:7px;height:7px;border-radius:50%;background:var(--hero-ink);animation:dot 1s infinite}
.cx-typing i:nth-child(2){animation-delay:.15s}
.cx-typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.cx-pick{display:flex;gap:12px;align-items:center;margin-top:10px}
.cx-pick .frame{width:72px;flex:none}
.cx-pi{min-width:0;display:flex;flex-direction:column;gap:2px}
.cx-pi b{font-family:var(--f-display);font-weight:800;font-size:17px;line-height:1.25}
.cx-pi small{color:var(--hero-muted);font-size:12.5px}
.cx-pr{font-weight:800;color:var(--gold-b);font-variant-numeric:tabular-nums}
.cx-pa,.cx-alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.cx-pa button,.cx-alts button{border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;border:1px solid rgba(238,245,218,.28);background:transparent;color:inherit}
.cx-pa .gold{border:0;background:linear-gradient(100deg,var(--gold-a),var(--gold-b) 55%,var(--gold-a));color:#2B230F}
.cx-alts{font-size:13px;color:var(--hero-muted)}
.cx-alts button{font-weight:600;padding:6px 12px;color:var(--hero-ink)}
.cx-chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px}
.cx-chips:empty{display:none}
.cx-chips button{border:1px solid rgba(244,213,141,.45);background:rgba(244,213,141,.08);color:inherit;border-radius:999px;padding:9px 15px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;
  animation:msgIn .35s var(--ease) both;animation-delay:calc(var(--i)*50ms);transition:background .2s}
.cx-chips button:hover{background:rgba(244,213,141,.18)}
.cx-chips button:active{transform:scale(.97)}
.cx-form{display:flex;gap:8px}
.cx-form input{flex:1;min-width:0;font:inherit;font-size:16px;color:inherit;background:rgba(238,245,218,.08);border:1px solid rgba(238,245,218,.18);border-radius:999px;padding:12px 18px}
.cx-form input::placeholder{color:var(--hero-muted)}
.cx-form input:focus{outline:none;border-color:var(--gold-b)}
.cx-form button{width:48px;height:48px;flex:none;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#2B230F;background:linear-gradient(100deg,var(--gold-a),var(--gold-b))}
.cx-form button svg{width:20px;height:20px}
:root[dir="rtl"] .cx-form button svg{transform:scaleX(-1)}

/* ADD BUTTON in the detail sheet */
.s-acts{display:flex;gap:8px;margin-top:18px}
.share-btn{flex:none;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .15s}
.s-acts .share-btn:only-child{flex:1}
.share-btn:active{transform:scale(.97)}
.share-btn svg{width:18px;height:18px}
.add-btn{flex:1;width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;
  background:linear-gradient(100deg,var(--gold-a),var(--gold-b) 55%,var(--gold-a));color:#2B230F;display:flex;justify-content:center;gap:8px;align-items:center;transition:transform .15s}
.add-btn:active{transform:scale(.98)}
.add-btn svg{width:14px;height:14px}
.plus.pop{animation:plusPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes plusPop{40%{transform:scale(1.3) rotate(90deg)}100%{transform:none}}

/* TRAY BAR + TRAY PANEL */
.traybar{position:fixed;z-index:30;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:66px;inset-inline-end:max(16px,env(safe-area-inset-right,0px));max-width:420px;
  display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;padding-inline:10px 16px;border:0;border-radius:18px;cursor:pointer;
  background:var(--brand);color:var(--on-brand);box-shadow:0 12px 28px rgba(0,0,0,.25);
  transform:translateY(140%);transition:transform .5s var(--ease)}
body.has-tray .traybar{transform:none}
body.sheet-open .traybar{transform:translateY(140%)}
.traybar.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.05)}}
.tb-count{min-width:30px;height:30px;padding-inline:6px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#2B230F;background:linear-gradient(100deg,var(--gold-a),var(--gold-b));font-variant-numeric:tabular-nums}
.tb-label{font-weight:700;font-size:14px}
.tb-total{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums}
.tray-h{font-family:var(--f-display);font-weight:900;font-size:26px;margin:4px 0 2px}
.tray-note{color:var(--muted);font-size:13px;margin:0 0 14px}
.t-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.t-row .n{font-weight:700}
.t-row .e{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:4px;grid-row:span 2}

.t-total strong{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.t-actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.t-actions a{display:flex;justify-content:center;align-items:center;gap:8px;text-decoration:none;border-radius:16px;padding:14px;font-weight:800;background:var(--brand);color:var(--on-brand)}
.t-actions a svg{width:18px;height:18px}
.t-actions button{border:1px solid var(--line);background:transparent;border-radius:16px;padding:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.t-empty{color:var(--muted);padding:30px 0;text-align:center}

/* back to top */
.totop{width:42px;height:42px;align-self:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);
  opacity:0;transform:translateY(10px) scale(.8);pointer-events:none;transition:opacity .3s,transform .3s var(--ease)}
/* LIVE: a pill that drops in when the studio changes the menu while it's open */
.live{position:fixed;z-index:35;top:calc(10px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;display:flex;align-items:center;gap:8px;
  padding:8px 14px 8px 10px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;color:#2B230F;
  background:linear-gradient(100deg,var(--gold-a),var(--gold-b) 55%,var(--gold-a));box-shadow:0 10px 26px rgba(0,0,0,.25);
  transform:translateY(-160%);transition:transform .55s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
.live.on{transform:none}
.live b{font-size:10px;font-weight:900;letter-spacing:.14em;padding:2px 7px;border-radius:999px;background:#2B230F;color:var(--gold-b);display:flex;align-items:center;gap:5px}
.live b::before{content:"";width:6px;height:6px;border-radius:50%;background:#7CE07C;box-shadow:0 0 0 0 rgba(124,224,124,.7);animation:livePulse 1.4s infinite}
@keyframes livePulse{70%{box-shadow:0 0 0 7px rgba(124,224,124,0)}100%{box-shadow:0 0 0 0 rgba(124,224,124,0)}}
.card.just{animation:justIn 1.6s var(--ease)}
@keyframes justIn{0%{box-shadow:0 0 0 0 rgba(244,213,141,.9)}100%{box-shadow:0 0 0 16px rgba(244,213,141,0)}}
.totop{position:relative}
.totop svg{width:18px;height:18px}
.totop .tt-ring{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg);pointer-events:none}
.tt-ring circle{fill:none;stroke-width:2.5;stroke:var(--line)}
.tt-ring circle + circle{stroke:var(--gold-a);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
.totop.on{opacity:1;transform:none;pointer-events:auto}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .mark .ring{stroke-dashoffset:0}
  .hero h1 em{animation:none!important}
  .eq .chalk path{stroke-dashoffset:0}.eq .steam path{opacity:.6}
}

/* ---------- DATA ----------
   The menu lives in menu.json (edited in the studio at /admin; the server keeps its copy in the data volume).
   item: caf caffeine 0-3 · sug sweetness 0-3 · t h hot / i iced / c chilled / r ready
         p price (null = coming soon) · sig A+ signature · nw new · out sold out today · img file in images/ */
let CATS = [], ITEMS = [], BY = {}, COMBOS = [], PAIR = {}, MENU_REV = '';
const ICON_OF = {};
function setMenu(m){
  CATS = m.cats || []; COMBOS = m.combos || []; PAIR = m.pair || {};
  CATS.forEach(c=>{ ICON_OF[c.id] = IC[c.icon] ? c.icon : 'coffee'; });
  ITEMS = (m.items || []).filter(it=>ICON_OF[it.c]).map(it=>({...it, img:'images/'+it.img}));
  BY = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
  MENU_REV = m.updated || '';
}
const menuReady = fetch('menu.json', {cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(setMenu);

/* ---------- STATE ---------- */
let lang = 'ar', filter = 'all', query = '', firstRender = true;
try{ const s = localStorage.getItem('aplus-lang'); if(s==='en'||s==='ar') lang = s; }catch(e){}
/* Table QR codes (tables.html) open index.html?table=7. Kept for this tab so a reload keeps it. */
let table = (new URLSearchParams(location.search).get('table')||'').replace(/[^0-9A-Za-z-]/g,'').slice(0,6);
try{ if(table) sessionStorage.setItem('aplus-table', table); else table = sessionStorage.getItem('aplus-table')||''; }catch(e){}
const $ = s => document.querySelector(s);
const L = () => T[lang];
const nm = it => it[lang] + (it.sz ? ` · ${it.sz}` : '');
const price = p => p==null ? `<span class="price" style="font-size:14px">${L().soon}</span>` : `<span class="price">${p.toLocaleString('en-US')}<span>${L().cur}</span></span>`;
const caf = n => `<span class="caf ${n?'':'none'}" title="${L().caffeine}: ${L().cafL[n]}">${[1,2,3].map(i=>BOLT(i<=n)).join('')}</span>`;
const frame = (it, cls='') => `<div class="frame ${cls}">${svg(ICON_OF[it.c],1.6)}<img src="${encodeURI(it.img)}" alt="" loading="lazy" onload="this.dataset.ok=1" onerror="this.remove()">${it.sig?'<span class="stamp">A+</span>':''}${it.nw?`<span class="ribbon">${L().nw}</span>`:''}${it.out?`<span class="out-tag">${L().out}</span>`:''}</div>`;
const orderable = it => it && it.p!=null && !it.out;

function match(it){
  if(filter==='hot' && it.t!=='h') return false;
  if(filter==='iced' && it.t!=='i') return false;
  if(filter==='nocaf' && it.caf!==0) return false;
  if(filter==='sig' && !it.sig) return false;
  if(query){ const q=query.toLowerCase(); return [it.en,it.ar,it.de,it.da].some(s=>s.toLowerCase().includes(q)); }
  return true;
}

function card(it,i){
  return `<button class="card ${it.soon?'soon':''} ${it.out?'out':''}" type="button" data-id="${it.id}" style="--d:${(i%4)*70}ms">
    ${frame(it)}
    <div class="c-body">
      <h3 class="c-name">${nm(it)}</h3>
      <p class="c-desc">${lang==='en'?it.de:it.da}</p>
      <div class="c-meta">${caf(it.caf)}<span class="tag">${L().temp[it.t]}</span></div>
      <div class="c-foot">${price(it.p)}${orderable(it)?`<span class="plus">${PLUS}</span>`:''}</div>
    </div></button>`;
}

function renderStatic(){
  const r = document.documentElement;
  r.lang = lang; r.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{ el.textContent = L()[el.dataset.t]; });
  $('#heroTitle').innerHTML = L().title;
  $('#langBtn').textContent = L().langBtn;
  $('#tableTag').hidden = !table; $('#tableTag span').textContent = table ? L().table(table) : '';
  $('#q').placeholder = L().search;
  $('#secBtn').setAttribute('aria-label', L().sections);
  $('#filters').innerHTML = ['all','hot','iced','nocaf','sig'].map(f=>`<button class="f ${f===filter?'on':''}" type="button" data-f="${f}">${L()[f]}</button>`).join('');
}

function renderMenu(){
  const visible = CATS.map(c=>({c, items:ITEMS.filter(it=>it.c===c.id && match(it))})).filter(g=>g.items.length);
  $('#rail').innerHTML = visible.map(({c,items},i)=>`<button class="chip ${i===0?'on':''}" type="button" data-sec="${c.id}">${svg(ICON_OF[c.id],2)}${c[lang]}<small>${items.length}</small></button>`).join('');
  $('#secList').innerHTML = visible.map(({c,items},i)=>`<button class="dd-item ${i===0?'on':''}" type="button" role="menuitem" data-sec="${c.id}" style="--i:${i}"><span class="di">${svg(ICON_OF[c.id],1.9)}</span>${c[lang]}<small>${items.length}</small></button>`).join('');
  $('#menu').innerHTML = visible.map(({c,items})=>`<section class="sec" id="sec-${c.id}">
      <div class="sec-head"><div class="sec-ic">${svg(ICON_OF[c.id],1.8)}</div><div><h2>${c[lang]}</h2><p>${L().items(items.length)}</p></div></div>
      <div class="grid">${items.map(card).join('')}</div></section>`).join('');
  $('#empty').classList.toggle('show', !visible.length);
  $('#combos').hidden = !!(query || filter!=='all');
  spy(); reveal();
}

function renderCombos(){
  $('#combos').innerHTML = `<h2>${L().combos}</h2><p>${L().combosSub}</p><div class="combo-row">${COMBOS.map((cb,i)=>{
    const its = cb.ids.map(id=>BY[id]).filter(Boolean); if(its.length<2) return ''; const total = its.reduce((a,b)=>a+(b.p||0),0);
    return `<div class="combo" style="--d:${i*90}ms"><h3>${cb[lang]}</h3><p class="note">${lang==='en'?cb.ne:cb.na}</p>
      <div class="combo-items">${its.map(it=>`<button type="button" data-id="${it.id}">${it[lang]}</button>`).join('<b>+</b>')}</div>
      <div class="combo-total"><span>${L().together}</span><strong>${total} ${L().cur}</strong></div></div>`;}).join('')}</div>`;
}

function renderAll(swap){
  renderStatic(); renderMenu(); renderCombos();
  if(swap){ const m=$('#menu'); m.classList.remove('swap'); void m.offsetWidth; m.classList.add('swap'); }
  if(openId){ if(BY[openId]) fillSheet(BY[openId]); else closeSheet(); }
  trayRender();
  if($('#finder').classList.contains('on')) cxRender();
}

/* ---------- SCROLL REVEAL (only for things below the fold, so the first frame is complete) ---------- */
let rio;
function reveal(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(!firstRender) return;
  firstRender = false;
  rio = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.remove('pending'); rio.unobserve(e.target);} }),{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.card,.sec-head,.combo').forEach(el=>{
    if(el.getBoundingClientRect().top > innerHeight){ el.classList.add('pending'); rio.observe(el); }
  });
}

/* ---------- SCROLLSPY ---------- */
let sio, lockSpy = 0;
function spy(){
  if(sio) sio.disconnect();
  sio = new IntersectionObserver(es=>{
    if(Date.now()<lockSpy) return;
    es.forEach(e=>{ if(e.isIntersecting) setChip(e.target.id.slice(4)); });
  },{rootMargin:'-30% 0px -60% 0px'});
  document.querySelectorAll('.sec').forEach(s=>sio.observe(s));
}
function setChip(id){
  const row = $('#rail'); let target;
  row.querySelectorAll('.chip').forEach(c=>{ const on = c.dataset.sec===id; c.classList.toggle('on',on); if(on) target=c; });
  document.querySelectorAll('#secList .dd-item').forEach(d=>d.classList.toggle('on', d.dataset.sec===id));
  if(target){
    const rr=row.getBoundingClientRect(), tr=target.getBoundingClientRect();
    row.scrollBy({left:(tr.left+tr.width/2)-(rr.left+rr.width/2),behavior:'smooth'});
  }
}

/* ---------- ITEM DETAIL SHEET ---------- */
let openId = null, lastFocus;
function fillSheet(it){
  const cat = CATS.find(c=>c.id===it.c), other = lang==='en'?'ar':'en';
  const pairs = (PAIR[it.c]||[]).map(id=>BY[id]).filter(p=>p && p.id!==it.id && !p.out);
  $('#sheetBody').innerHTML = `${frame(it,'s-frame')}
    <div class="s-cat">${cat[lang]}</div>
    <div class="s-title"><h3 id="sTitle">${nm(it)}<span class="alt" lang="${other}" dir="auto">${it[other]}</span></h3>${price(it.p)}</div>
    <p class="s-desc">${lang==='en'?it.de:it.da}</p>
    <div class="stats">
      <div class="stat"><div class="k">${L().caffeine}</div><div class="v">${caf(it.caf)}${L().cafL[it.caf]}</div></div>
      <div class="stat"><div class="k">${L().sweet}</div><div class="v"><span class="dots">${[1,2,3].map(i=>`<i class="${i<=it.sug?'f':''}"></i>`).join('')}</span>${L().sugL[it.sug]}</div></div>
      <div class="stat"><div class="k">${L().served}</div><div class="v">${L().temp[it.t]}</div></div>
      <div class="stat"><div class="k">${it.sz?L().size:'<bdi dir="ltr">A+</bdi>'}</div><div class="v">${it.sz||cat[lang]}</div></div>
    </div>
    ${it.sig?`<div class="sig-band"><b>A+</b>${L().sigNote}</div>`:''}${it.out?`<div class="sig-band out-band"><b>×</b>${L().outNote}</div>`:''}
    ${pairs.length?`<div class="pairs"><div class="k">${L().pairs}</div><div>${pairs.map(p=>`<button type="button" data-id="${p.id}">${p[lang]}<span>${p.p??''}</span></button>`).join('')}</div></div>`:''}
    <div class="s-acts">${!orderable(it)?'':`<button class="add-btn" type="button" data-add="${it.id}">${PLUS}<span>${L().add}</span></button>`}
      <button class="share-btn" type="button" data-share="${it.id}" aria-label="${L().share}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span>${L().share}</span></button></div>`;
  $('#closeBtn').setAttribute('aria-label', lang==='en'?'Close':'إغلاق');
}
function openSheet(id){
  const it = BY[id]; if(!it) return;
  const sh = $('#sheet'), wasOpen = sh.classList.contains('on');
  if($('#trayPanel').classList.contains('on')) $('#trayPanel').classList.remove('on');
  openId = id; fillSheet(it); sh.scrollTop = 0;
  if(!wasOpen) lastFocus = document.activeElement;
  else { const f=sh.querySelector('.s-frame'); f.style.animation='none'; void f.offsetWidth; f.style.animation=''; }
  sh.classList.add('on'); $('#scrim').classList.add('on'); document.body.classList.add('sheet-open');
  document.body.style.overflow='hidden';
  setTimeout(()=>$('#closeBtn').focus({preventScroll:true}), 60);
}
function closeSheet(){
  if(!openId) return;
  const sh=$('#sheet'); sh.classList.remove('on'); sh.style.transform='';
  $('#scrim').classList.remove('on'); document.body.classList.remove('sheet-open'); document.body.style.overflow='';
  openId=null; if(lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true});
}
/* swipe down to close */
(()=>{ const sh=$('#sheet'); let y0=null, dy=0;
  sh.addEventListener('touchstart',e=>{ if(sh.scrollTop>0) return; y0=e.touches[0].clientY; dy=0; sh.classList.add('drag'); },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0===null) return; dy=Math.max(0,e.touches[0].clientY-y0); sh.style.transform=`translateY(${dy}px)`; },{passive:true});
  sh.addEventListener('touchend',()=>{ if(y0===null) return; sh.classList.remove('drag'); if(dy>110) closeSheet(); else sh.style.transform=''; y0=null; });
})();

/* ---------- EVENTS ---------- */
document.addEventListener('click',e=>{
  const idEl = e.target.closest('[data-id]'); if(idEl){ openSheet(idEl.dataset.id); return; }
  const chip = e.target.closest('[data-sec]');
  if(chip){ ddOpen(false); lockSpy=Date.now()+900; setChip(chip.dataset.sec); $('#sec-'+chip.dataset.sec).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); return; }

$('#scrim').addEventListener('click',closeSheet);
$('#closeBtn').addEventListener('click',closeSheet);
addEventListener('keydown',e=>{ if(e.key==='Escape' && openId) closeSheet(); });

/* ---------- TRAY ---------- */
let tray = {};
try{ tray = JSON.parse(localStorage.getItem('aplus-tray')||'{}') || {}; }catch(e){ tray = {}; }
const trayInit = () => Object.keys(tray).forEach(id=>{ if(!orderable(BY[id])) delete tray[id]; });
const traySave = () => { try{ localStorage.setItem('aplus-tray', JSON.stringify(tray)); }catch(e){} };
const trayCount = () => Object.values(tray).reduce((a,b)=>a+b,0);
const trayTotal = () => Object.entries(tray).reduce((a,[id,q])=>a+BY[id].p*q,0);
const buzz = () => { try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} };
function trayAdd(id, d=1){
  const it = BY[id]; if(!orderable(it)) return;
  tray[id] = (tray[id]||0) + d; if(tray[id] <= 0) delete tray[id];
  traySave(); trayRender(); buzz();
  if(d>0){ const b=$('#trayBar'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
}
function trayRender(){
  const n = trayCount();
  document.body.classList.toggle('has-tray', n>0);
  $('#tbCount').textContent = n;
  $('#tbTotal').textContent = `${trayTotal().toLocaleString('en-US')} ${L().cur}`;
  const rows = Object.entries(tray).map(([id,q])=>{ const it=BY[id]; return `<div class="t-row"><div class="n">${nm(it)}</div>
      <div class="qty"><button type="button" data-tq="${id}" data-d="-1" aria-label="−">−</button><span>${q}</span><button type="button" data-tq="${id}" data-d="1" aria-label="+">+</button></div>
      <div class="e">${q} × ${it.p} = ${(q*it.p).toLocaleString('en-US')} ${L().cur}</div></div>`; }).join('');
  const msg = [L().waMsg, ...(table?[L().table(table)]:[]), ...Object.entries(tray).map(([id,q])=>`${q} × ${nm(BY[id])} = ${q*BY[id].p} ${L().cur}`), `${L().total}: ${trayTotal()} ${L().cur}`].join('\n');
  $('#trayBody').innerHTML = `<h3 class="tray-h" id="trayTitle">${L().tray}${table?` · ${L().table(table)}`:''}</h3><p class="tray-note">${n?L().trayNote:''}</p>
    ${n ? rows + `<div class="t-total"><span>${L().total}</span><strong>${trayTotal().toLocaleString('en-US')} ${L().cur}</strong></div>
      <div class="t-actions"><a href="https://wa.me/963969717279?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg>${L().send}</a>
      <button type="button" id="trayClear">${L().clearTray}</button></div>` : `<div class="t-empty">${L().trayEmpty}</div>`}`;
}
function openTray(){ if(openId) closeSheet(); trayRender(); $('#trayPanel').classList.add('on'); $('#scrim').classList.add('on'); document.body.classList.add('sheet-open'); document.body.style.overflow='hidden'; }
function closeTray(){ $('#trayPanel').classList.remove('on'); if(!openId){ $('#scrim').classList.remove('on'); document.body.classList.remove('sheet-open'); document.body.style.overflow=''; } }
$('#trayBar').addEventListener('click', openTray);
$('#trayClose').addEventListener('click', closeTray);
$('#scrim').addEventListener('click', closeTray);

/* add-to-tray and quantity clicks run first, so they don't also open the item */
document.addEventListener('click', e=>{
  const add = e.target.closest('[data-add]');
  const plus = e.target.closest('.card .plus');
  const q = e.target.closest('[data-tq]');
  if(e.target.closest('#trayClear')){ tray={}; traySave(); trayRender(); e.stopPropagation(); return; }
  if(q){ trayAdd(q.dataset.tq, +q.dataset.d); e.stopPropagation(); return; }
  if(plus){ const id = plus.closest('.card').dataset.id; if(orderable(BY[id])){ trayAdd(id); plus.classList.remove('pop'); void plus.offsetWidth; plus.classList.add('pop'); } e.stopPropagation(); return; }
  const sh = e.target.closest('[data-share]');
  if(sh){ e.stopPropagation(); shareItem(BY[sh.dataset.share], sh); return; }
  /* the sheet's button has a label span; the chat's button is just text */
  if(add){ trayAdd(add.dataset.add); const s = add.querySelector('span') || add, was = s.textContent; s.textContent = L().added; setTimeout(()=>{ s.textContent = was; }, 1200); e.stopPropagation(); }
}, true);

/* ---------- LIVE: sold-out switches and price changes from the studio reach open menus ----------
   Checks menu.json every 45 s while the page is visible (a 304 when nothing changed) and right after the phone wakes. */
(()=>{
  let busy = false, tid;
  const pill = document.createElement('div');
  pill.className = 'live'; pill.setAttribute('role', 'status'); pill.innerHTML = '<b>LIVE</b><span></span>';
  document.body.appendChild(pill);
  const check = async () => {
    if(busy || document.hidden || !MENU_REV) return;
    busy = true;
    try{
      const r = await fetch('menu.json', {cache:'no-cache'});
      if(!r.ok) return;
      const m = await r.json();
      if(!m.updated || m.updated === MENU_REV) return;
      const before = Object.fromEntries(ITEMS.map(i=>[i.id, JSON.stringify(i)]));
      setMenu(m); trayInit(); renderAll(false);
      /* glow the cards that changed */
      ITEMS.filter(i=>before[i.id] !== JSON.stringify(i)).forEach(i=>document.querySelector(`.card[data-id="${i.id}"]`)?.classList.add('just'));
      pill.querySelector('span').textContent = L().live; pill.classList.add('on'); buzz();
      clearTimeout(tid); tid = setTimeout(()=>pill.classList.remove('on'), 3200);
    }catch(e){}finally{ busy = false; }
  };
  setInterval(check, 45000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) check(); });
})();

/* ---------- SHARE: native share sheet on phones, copy link elsewhere ---------- */
async function shareItem(it, btn){
  const url = `${location.origin}${location.pathname}?item=${it.id}`, title = L().shareTxt(nm(it));
  if(navigator.share){ try{ await navigator.share({title, text:title, url}); }catch(e){} return; }
  try{ await navigator.clipboard.writeText(url); }catch(e){ prompt(title, url); return; }
  const s = btn.querySelector('span'); s.textContent = L().linkCopied; setTimeout(()=>{ s.textContent = L().share; }, 1600);
}

/* ---------- FINDER: a chat that asks what the customer feels like, then picks from the menu ----------
   Answers come from the chips or from typed text (Arabic or English): typed words fill the same answers,
   so "iced, no caffeine, not too sweet" skips three questions. The log keeps keys, not text, so it follows the language. */
const CX_KIND = {coffee:'drink',warm:'drink',iced:'drink',mocktails:'drink',cold:'drink',energy:'drink',snacks:'eat',food:'eat'};
const CX_DRINK = ['caf','temp','sw'];
const CXQ = [
  {k:'want', o:['drink','eat','both']},
  {k:'caf', o:['strong','some','none','any'], when:s=>s.want!=='eat'},
  {k:'temp', o:['h','cold','any'], when:s=>s.want!=='eat'},
  {k:'sw', o:[0,1.5,3], when:s=>s.want!=='eat'},
  {k:'bite', o:['meal','sweet','any'], when:s=>s.want!=='drink'}
];
const cxNorm = s => s.toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
/* patterns are written as people type; nre() folds them the same way as the message */
const nre = re => new RegExp(cxNorm(re.source));
const NO = '(?:بدون|بلا|بلاش|ما بدي|مابدي|مو|مش|no|not|without|zero)\\s*(?:ال)?';
/* [answer, value, pattern]: the first match wins for each answer, so the specific patterns come first */
const CXW = [
  ['caf','none', new RegExp(NO+'(?:كافيين|كافين|قهوه|منبه|caff|coffee)|decaf|caffeine.?free')],
  ['caf','some', /(?:شوي|شويه|خفيف|قليل)\s*(?:ال)?(?:كافيين|كافين|قهوة)|(?:light|little|bit of|mild)\s*(?:caff|coffee)/],
  ['caf','strong', /قوي|تقيل|امتحان|فحص|سهر|نعسان|نعس|صحصح|طاقة|انرجي|\b(?:strong|exams?|tests?|awake|sleepy|tired|energy|boost|late)\b|all.?night/],
  ['caf','none', /(?:^|\s)(?:نام|نوم|رايق|ارتاح)|\b(?:sleep|relax|calm)/],
  ['caf','yes', /كافيين|كافين|قهوة|اسبريسو|لاتيه|coffee|caff|espresso|latte/],
  ['temp','cold', /بارد|مثلج|(?:^|\s)ايس|ثلج|منعش|شوب|(?:^|\s)حر(?:$|\s)|\b(?:cold|iced?|chilled|refreshing)\b|hot (?:day|weather|outside)/],
  ['temp','h', /ساخن|سخن|دافي|دافئ|بردان|سقعان|\b(?:hot|warm|freezing)\b/],
  ['sw',1.5, /(?:شوي|شويه|خفيف|قليل|وسط|نص|مو كتير|مش كتير)\s*(?:ال)?(?:سكر|حلو|حلاوة)|سكر خفيف|(?:little|bit|lightly|slightly|medium|not too|not so|not very|less) sweet/],
  ['sw',0, new RegExp(NO+'(?:سكر|حلو|حلاوه)|ساده|(?:^|\\s)مر(?:$|\\s)|no sugar|sugar.?free|not sweet|unsweet|bitter')],
  ['sw',3, /حلو|سكر|حلاوة|كراميل|شوكولا|sweet|sugar|caramel|chocolate/],
  ['bite','meal', /جوعان|جوع|سندويش|ساندويش|وجبة|مالح|يشبع|hungry|sandwich|meal|starving|filling|salty|savou?ry/],
  ['bite','sweet', /شوكولا|كوكيز|بسكوت|تحلاية|chocolate|cookie|dessert|candy/]
].map(([k,v,re])=>[k,v,nre(re)]);
const CXF = Object.fromEntries(Object.entries({
  eat:/جوعان|جوع|(?:^|\s)[وب]?(?:اكل|اكلة|آكل)(?:$|\s)|سندويش|ساندويش|سناك|وجبة|\b(?:hungry|eat|food|sandwich|snacks?|bite|meal|starving)\b/,
  drink:/(?:^|\s)[وب]?(?:اشرب|شرب|مشروب)|عطشان|عطش|\b(?:drinks?|sip|thirsty)\b/,
  both:/الاتنين|الاثنين|التنين|كومبو|\b(?:both|combo)\b/,
  any:/ما بتفرق|مابتفرق|مش فارقة|عادي|\b(?:either|no preference)\b|doesn'?t matter/,
  surprise:/فاجئني|فاجئ|فاجاني|اي شي|ايشي|ما بعرف|مابعرف|مش عارف|اختارلي|اختار انت|انت اختار|اقترح|\b(?:surprise|anything|whatever|idk|dunno|recommend|suggest)\b|don'?t know|you (?:choose|pick|decide)/,
  more:/(?:^|\s)غير|تاني|ما عجبني|ما حبيت|\b(?:another|else|different|other|next)\b|don'?t like|not this/,
  sweeter:/احلى|سكر زيادة|زيد السكر|\bsweeter\b|more sweet|more sugar/,
  less:/اقل حلاوة|اقل سكر|خفف السكر|less sweet|less sugar/,
  stronger:/اقوى|\bstronger\b|more caff/,
  cheaper:/ارخص|رخيص|اقتصادي|ميزانية|\b(?:cheap(?:er)?|budget|afford)/,
  restart:/من الاول|من جديد|\b(?:restart|start over|reset)\b/,
  hi:/^(?:مرحبا|مرحبتين|هاي|هلا|اهلين|اهلا|سلام|السلام|hi|hello|hey|yo)(?:$|[\s.!,،])/,
  thanks:/شكرا|يسلمو|تسلم|مشكور|\b(?:thanks|thank you|thx|ty)\b/,
  yes:/^(?:اي|ايه|ايوه|اكيد|نعم|طبعا|yes|yeah|yep|yup|sure|ok|okay)(?:$|[\s.!,،])/,
  no:/^(?:لا|لاء|no|nope|nah)(?:$|[\s.!,،])/
}).map(([k,re])=>[k,nre(re)]));
const esc = s => s.replace(/[&<>"']/g, c=>`&#${c.charCodeAt(0)};`);
const cxKind = id => CX_KIND[ICON_OF[BY[id]?.c]] || 'drink';
const cxReduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let cx = {log:[], s:{}, q:null, done:false, last:null, rank:{}, at:{}, pend:null, shown:0, typing:false, seed:Date.now()%233280};

function cxRank(kind){
  const s = cx.s, pairs = kind==='eat' ? PAIR[BY[cx.last]?.c] || [] : [];
  let pool = ITEMS.filter(it=>orderable(it) && CX_KIND[ICON_OF[it.c]]===kind), closest = false;
  const prices = pool.map(i=>i.p).sort((a,b)=>a-b), cheap = prices[Math.floor(prices.length*.4)];
  const rules = kind==='drink'
    ? [s.caf==='none' && (it=>it.caf===0), s.caf==='strong' && (it=>it.caf>=2), s.caf==='some' && (it=>it.caf>=1 && it.caf<=2), s.caf==='yes' && (it=>it.caf>=1),
       s.temp==='h' && (it=>it.t==='h'), s.temp==='cold' && (it=>it.t!=='h')]
    : [s.bite==='meal' && (it=>it.sug<=1), s.bite==='sweet' && (it=>it.sug>=2)];
  rules.push(s.max && s.max.k===kind && (it=>it.p<=s.max.p), s.cheap && (it=>it.p<=cheap));
  /* a rule that would leave nothing is skipped, and the answer says it's the closest match */
  for(const f of rules.filter(Boolean)){ const next = pool.filter(f); if(next.length) pool = next; else closest = true; }
  const caf = kind==='drink' ? {none:0,some:1,yes:2,strong:3}[s.caf] : undefined;
  const sw = kind==='drink' ? (typeof s.sw==='number' ? s.sw : undefined) : s.bite==='sweet' ? 3 : undefined;
  let r = cx.seed; const rnd = () => (r = (r*9301+49297)%233280)/233280;
  const ids = pool.map(it=>({id:it.id, sc:(caf==null?0:-Math.abs(it.caf-caf)*2) - (sw==null?0:Math.abs(it.sug-sw)*1.3) + (it.sig?.4:0) + (pairs.includes(it.id)?.8:0) + rnd()*.9}))
    .sort((a,b)=>b.sc-a.sc).map(x=>x.id);
  return {ids, closest};
}
function cxSimilar(it){
  return ITEMS.filter(o=>o.id!==it.id && orderable(o) && CX_KIND[ICON_OF[o.c]]===CX_KIND[ICON_OF[it.c]])
    .map(o=>({id:o.id, d:Math.abs(o.caf-it.caf)*2 + Math.abs(o.sug-it.sug) + (o.t===it.t?0:1.5) + (o.c===it.c?0:1)})).sort((a,b)=>a.d-b.d).map(x=>x.id);
}
function cxNamed(t){
  let best = null;
  for(const it of ITEMS) for(const n of [it.ar, it.en]){
    const k = cxNorm(n.replace(/\(.*?\)/g,''));
    if(k.length>=3 && t.includes(k) && t.length-k.length<=12 && (!best || k.length>best.k.length)) best = {it, k};
  }
  return best && best.it;
}

function cxBot(msgs){
  cx.typing = true; cxRender();
  setTimeout(()=>{ cx.typing = false; cx.log.push(...msgs); cxRender(); }, cxReduced() ? 0 : 450 + Math.min(msgs.length,3)*170);
}
function cxStart(again){
  Object.assign(cx, {s:{}, q:'want', done:false, last:null, rank:{}, at:{}, pend:null, seed:(cx.seed+7919)%233280});
  cxBot(again ? [{t:'again'},{ask:'want'}] : [{t:'hello'},{t:'hint'},{ask:'want'}]);
}
function cxNext(only){
  const q = CXQ.find(q=>(!q.when || q.when(cx.s)) && cx.s[q.k]==null);
  cx.q = q ? q.k : null;
  if(q){ if(only) cx.pend = only; cxBot([{ask:q.k}]); }
  else cxBot(cxResult(only || cx.pend));
}
function cxResult(only){
  const refining = cx.done, out = [];
  cx.done = true; cx.pend = null;
  ['drink','eat'].forEach(kind=>{
    if((only && only!==kind) || (cx.s.want!=='both' && cx.s.want!==kind)) return;
    const {ids, closest} = cxRank(kind);
    if(refining && ids[0]===cx.last && ids.length>1) ids.push(ids.shift());
    cx.rank[kind] = ids; cx.at[kind] = 0;
    if(!ids.length) return;
    const lead = closest ? 'closest' : kind==='eat' ? (cx.s.want==='both' ? 'food' : 'pick') : cx.s.caf==='strong' ? 'exam' : cx.s.caf==='none' ? 'calm' : 'pick';
    out.push({pick:ids[0], alts:ids.slice(1,3), lead});
    if(out.length===1) cx.last = ids[0];
  });
  return out.length ? out : [{t:'none'}];
}
function cxMore(){
  const kind = cxKind(cx.last);
  if(!cx.rank[kind]){ cx.rank[kind] = cxRank(kind).ids.filter(id=>id!==cx.last); cx.at[kind] = -3; }
  const ids = cx.rank[kind], at = cx.at[kind] += 3;
  if(at >= ids.length) return cxBot([{t:'none'}]);
  cx.last = ids[at];
  cxBot([{pick:ids[at], alts:ids.slice(at+1, at+3), lead:'more'}]);
}
function cxShow(id){
  const it = BY[id]; if(!it) return;
  cx.q = null; cx.done = true; cx.rank[cxKind(id)] = null;
  if(!orderable(it)){
    const sim = cxSimilar(it); cx.last = sim[0] || null;
    return cxBot([{t:'soldOut', id}, ...(sim.length ? [{pick:sim[0], alts:sim.slice(1,3), lead:'closest'}] : [])]);
  }
  cx.last = id;
  cxBot([{pick:id, alts:(PAIR[it.c]||[]).filter(p=>p!==id && orderable(BY[p])), ak:'pairs', lead:'named'}]);
}
function cxAct(a){
  cx.log.push({act:a});
  const cur = BY[cx.last];
  if(a==='restart') cxStart(true);
  else if(a==='more') cxMore();
  else if(a==='eat'){ cx.s.want = 'both'; cxNext('eat'); }
  else { cx.s.sw = Math.max(0, Math.min(3, cur.sug + (a==='sweeter'?1:-1))); cxNext('drink'); }
}
/* typed text: read every answer it holds, then ask whatever is still missing */
function cxHear(raw){
  const text = raw.trim().slice(0,200), t = cxNorm(text); if(!t) return;
  cx.log.push({me:text});
  const f = k => CXF[k].test(t), s = cx.s, got = {}, cur = BY[cx.last];
  if(f('restart')) return cxStart(true);
  const named = cxNamed(t);
  if(named) return cxShow(named.id);
  CXW.forEach(([k,v,re])=>{ if(!(k in got) && re.test(t)) got[k] = v; });
  if(cx.done && cur){
    if(f('sweeter')) got.sw = Math.min(3, cur.sug+1); else if(f('less')) got.sw = Math.max(0, cur.sug-1);
    if(f('stronger')) got.caf = 'strong';
    if(f('cheaper')) got.max = {k:cxKind(cur.id), p:cur.p-1};
  } else if(f('cheaper')) got.cheap = true;
  /* "something sweet" while choosing food is about the food, not the drink's sugar */
  if((s.want==='eat' || cx.q==='bite') && got.sw!=null && got.bite==null && got.caf==null && got.temp==null && !f('drink')){ got.bite = got.sw>=1.5 ? 'sweet' : 'meal'; delete got.sw; }
  const eat = f('eat') || 'bite' in got, drink = f('drink') || CX_DRINK.some(k=>k in got);
  if(f('both') || (eat && drink)) got.want = 'both';
  else if(eat && s.want!=='eat' && s.want!=='both') got.want = s.want ? 'both' : 'eat';
  else if(drink && !s.want) got.want = 'drink';
  else if(drink && s.want==='eat') got.want = 'both';
  if(f('surprise')){
    const want = got.want || s.want || (got.want = 'drink');
    CXQ.forEach(q=>{ if(q.k!=='want' && !(q.k in got) && s[q.k]==null && (!q.when || q.when({want}))) got[q.k] = 'any'; });
  } else if(cx.q && !(cx.q in got)){
    if(f('any') && cx.q!=='want') got[cx.q] = 'any';
    else if(f('yes') && cx.q==='caf') got.caf = 'yes';
    else if(f('no') && cx.q==='caf') got.caf = 'none';
    else if(f('no') && cx.q==='sw') got.sw = 0;
  }
  if(!Object.keys(got).length){
    if(cx.done && (f('more') || f('no'))) return cxMore();
    if(cx.done && f('yes') && s.want==='drink') return cxAct('eat');
    if(f('thanks')) return cxBot([{t:'thanks'}]);
    const again = cx.q ? [{ask:cx.q}] : cx.done ? [{t:'hint2'}] : [];
    return cxBot([{t:f('hi') ? 'hi' : 'huh'}, ...again]);
  }
  let only;
  if(cx.done){
    const d = CX_DRINK.some(k=>k in got), e = 'bite' in got || (got.want==='both' && s.want==='drink');
    only = d && !e ? 'drink' : e && !d ? 'eat' : !d && !e && (got.max || got.cheap) ? cxKind(cx.last) : undefined;
  }
  Object.assign(s, got);
  cxNext(only);
}

function cxMsg(m, Lx, nw){
  const C = Lx.cx, n = nw ? ' new' : '';
  if(m.me!=null) return `<div class="cx-m me${n}">${Array.isArray(m.me) ? C.o[m.me[0]][m.me[1]] : esc(m.me)}</div>`;
  if(m.act) return `<div class="cx-m me${n}">${C.act[m.act]}</div>`;
  if(m.item) return BY[m.item] ? `<div class="cx-m me${n}">${BY[m.item][lang]}</div>` : '';
  if(m.ask) return `<div class="cx-m bot${n}">${C.q[m.ask]}</div>`;
  if(m.t){ const v = C[m.t]; return `<div class="cx-m bot${n}">${typeof v==='function' ? v(m) : v}</div>`; }
  const it = BY[m.pick]; if(!it) return '';
  const why = (CX_KIND[ICON_OF[it.c]]==='drink' ? `${Lx.caffeine}: ${Lx.cafL[it.caf]} · ` : '') + `${Lx.sweet}: ${Lx.sugL[it.sug]} · ${Lx.temp[it.t]}`;
  const alts = (m.alts||[]).map(id=>BY[id]).filter(orderable);
  return `<div class="cx-m bot wide${n}">${C.lead[m.lead]}
    <div class="cx-pick">${frame(it)}<div class="cx-pi"><b>${nm(it)}</b><small>${why}</small>${it.p!=null?`<span class="cx-pr">${it.p.toLocaleString('en-US')} ${Lx.cur}</span>`:''}</div></div>
    ${orderable(it) ? `<div class="cx-pa"><button class="gold" type="button" data-add="${it.id}">${Lx.add}</button><button type="button" data-fdopen="${it.id}">${Lx.details}</button></div>` : ''}
    ${alts.length ? `<div class="cx-alts"><span>${m.ak==='pairs' ? Lx.pairs : C.alts}</span>${alts.map(a=>`<button type="button" data-cxpick="${a.id}">${a[lang]} · ${a.p}</button>`).join('')}</div>` : ''}</div>`;
}
function cxChips(C){
  if(cx.typing) return '';
  if(cx.q) return CXQ.find(q=>q.k===cx.q).o.map((v,i)=>`<button type="button" data-cx="${cx.q}|${v}" style="--i:${i}">${C.o[cx.q][v]}</button>`).join('');
  if(!cx.done) return '';
  const cur = BY[cx.last], drink = cur && cxKind(cur.id)==='drink';
  return [cur && 'more', drink && cur.sug<3 && 'sweeter', drink && cur.sug>0 && 'less', drink && cx.s.want==='drink' && 'eat', 'restart']
    .filter(Boolean).map((a,i)=>`<button type="button" data-cxa="${a}" style="--i:${i}">${C.act[a]}</button>`).join('');
}
function cxRender(){
  const Lx = L(), C = Lx.cx, log = $('#cxLog');
  $('#cxTitle').textContent = C.title; $('#cxStatus').textContent = C.status;
  $('#cxIn').placeholder = C.place; $('#cxIn').setAttribute('aria-label', C.place); $('#cxSend').setAttribute('aria-label', C.send);
  log.innerHTML = cx.log.map((m,i)=>cxMsg(m, Lx, i>=cx.shown)).join('') + (cx.typing ? '<div class="cx-m bot cx-typing new" aria-hidden="true"><i></i><i></i><i></i></div>' : '');
  cx.shown = cx.log.length;
  $('#cxChips').innerHTML = cxChips(C);
  log.scrollTop = log.scrollHeight;
}
$('#cxAv').innerHTML = logo(false);
function openFinder(){ if(!cx.log.length && !cx.typing) cxStart(); else cxRender(); $('#finder').classList.add('on'); document.body.style.overflow='hidden'; document.body.classList.add('sheet-open'); setTimeout(()=>$('#fdClose').focus({preventScroll:true}),100); }
function closeFinder(){ $('#finder').classList.remove('on'); document.body.style.overflow=''; document.body.classList.remove('sheet-open'); }
$('#findBtn').addEventListener('click', openFinder);
$('#fdClose').addEventListener('click', closeFinder);
$('#finder').addEventListener('click', e=>{
  const a=e.target.closest('[data-cx]'), act=e.target.closest('[data-cxa]'), p=e.target.closest('[data-cxpick]'), o=e.target.closest('[data-fdopen]');
  if(cx.typing && (a||act||p)) return;
  if(a){ const [k,v] = a.dataset.cx.split('|'); cx.log.push({me:[k,v]}); cx.s[k] = k==='sw' ? +v : v; cxNext(); buzz(); }
  else if(act){ cxAct(act.dataset.cxa); buzz(); }
  else if(p){ cx.log.push({item:p.dataset.cxpick}); cxShow(p.dataset.cxpick); buzz(); }

});
$('#cxForm').addEventListener('submit', e=>{ e.preventDefault(); const i = $('#cxIn'); if(cx.typing || !i.value.trim()) return; cxHear(i.value); i.value = ''; });
addEventListener('keydown', e=>{ if(e.key!=='Escape') return; if($('#finder').classList.contains('on')) closeFinder(); else if($('#trayPanel').classList.contains('on')) closeTray(); });

/* ---------- SECTIONS DROPDOWN ---------- */
function ddOpen(open){
  const m = $('#secMenu'), b = $('#secBtn');
  if(m.classList.contains('open') === open) return;
  m.classList.toggle('open', open); b.setAttribute('aria-expanded', open);
  if(open){ buzz(); setTimeout(()=>{ (m.querySelector('.dd-item.on') || m.querySelector('.dd-item'))?.focus({preventScroll:true}); }, 80); }
}
$('#secBtn').addEventListener('click', ()=>ddOpen(!$('#secMenu').classList.contains('open')));
document.addEventListener('click', e=>{ if(!e.target.closest('#secMenu,#secBtn')) ddOpen(false); });
$('#ddFind').addEventListener('click', ()=>{ ddOpen(false); openFinder(); });
$('#secMenu').addEventListener('keydown', e=>{
  const items = [...$('#secMenu').querySelectorAll('.dd-item,#ddFind')], i = items.indexOf(document.activeElement);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); items[(i + (e.key==='ArrowDown'?1:-1) + items.length) % items.length].focus(); }
  else if(e.key==='Home'||e.key==='End'){ e.preventDefault(); items[e.key==='Home'?0:items.length-1].focus(); }
  else if(e.key==='Escape'){ ddOpen(false); $('#secBtn').focus(); }
});

/* ---------- BACK TO TOP + SCROLL PROGRESS (gold line under the rail, ring around the button) ---------- */
(()=>{ const b=$('#toTop'), bar=$('#railProg'), ring=$('#toTopRing'); let tk=false;
  const upd = () => {
    const max = document.documentElement.scrollHeight - innerHeight, p = max > 0 ? Math.min(1, scrollY / max) : 0;
    bar.style.setProperty('--sp', p.toFixed(4)); ring.style.strokeDashoffset = (100 - p*100).toFixed(2);
    b.classList.toggle('on', scrollY > 900); tk=false;
  };
  addEventListener('scroll',()=>{ if(tk) return; tk=true; requestAnimationFrame(upd); },{passive:true});
  addEventListener('resize', upd); upd();
  b.addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
  b.setAttribute('aria-label', 'Back to top');
})();

/* ---------- PAST-HERO FLAG: floating buttons only appear once the hero is behind you ---------- */
(()=>{ const h=$('#hero'); const f=()=>document.body.classList.toggle('past-hero', h.getBoundingClientRect().bottom < innerHeight*.6);
  addEventListener('scroll',f,{passive:true}); f(); })();

/* ---------- HERO STAMP: tap the A+ seal to stamp it again ---------- */
(()=>{
  const eq = $('#eq');
  $('#seal').addEventListener('click', ()=>{
    eq.classList.add('hold'); void eq.offsetWidth;
    eq.classList.remove('hold'); eq.classList.add('again');
    navigator.vibrate?.(20);
  });
})();

/* ---------- LOADER ---------- */
(()=>{
  const ld = $('#loader'), bar = $('#ldBar'), pct = $('#ldPct');
  $('#ldMark').innerHTML = logo(true).replace(/id="g1"/,'id="gL"').replace(/url\(#g1\)/,'url(#gL)');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const minTime = reduced ? 300 : 1700, t0 = performance.now();
  let loaded = document.readyState === 'complete', shown = 0, done = false;
  /* hold the bar until both the page and menu.json have arrived */
  let winLoaded = loaded, menuDone = false; loaded = false;
  addEventListener('load', ()=>{ winLoaded = true; loaded = menuDone; });
  menuReady.finally(()=>{ menuDone = true; loaded = winLoaded; });
  setTimeout(()=>{ loaded = true; }, 3500); /* never hold the page longer than this */
  const step = () => {
    const tp = Math.min(1, (performance.now() - t0) / minTime);
    const target = loaded ? tp : Math.min(tp, .88);
    shown += (target - shown) * .18;
    if(target === 1 && shown > .995) shown = 1;
    bar.parentNode.style.setProperty('--pr', shown.toFixed(3)); bar.style.transform = `scaleX(${shown})`;
    pct.textContent = Math.round(shown*100) + '%';
    if(shown === 1 && !done){ done = true; finish(); return; }
    requestAnimationFrame(step);
  };
  const finish = () => {
    setTimeout(()=>{
      ld.classList.add('out');
      document.documentElement.classList.remove('is-loading');
      setTimeout(()=>ld.classList.add('gone'), 950);
      /* shared links like aplus-sy.com/?item=iced-biscoff open straight to that drink */
      const share = new URLSearchParams(location.search).get('item');
      if(share && BY[share]){ $('#sec-'+BY[share].c)?.scrollIntoView(); setTimeout(()=>openSheet(share), 450); }
    }, reduced ? 0 : 250);
  };
  requestAnimationFrame(step);
})();
$('#miniMark').innerHTML = logo(false);
renderStatic();
menuReady.then(()=>{ trayInit(); renderAll(false); }).catch(()=>{
  $('#menu').innerHTML = `<div class="empty show"><p>${L().loadErr}</p><button type="button" onclick="location.reload()">${L().retry}</button></div>`;
});
/* offline + "add to home screen"; service workers need http(s) or localhost, not file:// */
if('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
